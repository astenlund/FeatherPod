<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Push to {{FEED_TITLE}}</title>
    <link rel="icon" type="image/png" href="/{{FEED_ID}}/icon.png{{ICON_CACHE_BUSTER}}">
    {{PWA_HEAD}}
    <link rel="modulepreload" href="/{{FEED_ID}}/push/modules/config.js">
    <link rel="modulepreload" href="/{{FEED_ID}}/push/modules/events.js">
    <link rel="modulepreload" href="/{{FEED_ID}}/push/modules/utils.js">
    <link rel="modulepreload" href="/{{FEED_ID}}/push/modules/auth.js">
    <link rel="modulepreload" href="/{{FEED_ID}}/push/modules/artwork.js">
    <link rel="modulepreload" href="/{{FEED_ID}}/push/modules/wake-lock.js">
    <link rel="modulepreload" href="/{{FEED_ID}}/push/modules/notifications.js">
    <link rel="stylesheet" href="/{{FEED_ID}}/push/app.css">
</head>
<body>
    <div id="artwork-backdrop" class="artwork-backdrop"></div>
    <div class="container">
        <h1 id="page-title">Push to Feed</h1>
        <img id="feed-artwork" src="/{{FEED_ID}}/icon.png{{ICON_CACHE_BUSTER}}" alt="" hidden>
        <h2 id="feed-name" class="feed-name">{{FEED_TITLE}}</h2>

        <div id="no-key" class="state" style="display: none;">
            <h2 id="no-key-title" class="no-key-title">API key required</h2>
            <div id="no-key-content">
                <button id="paste-key-btn" class="btn-primary">Paste here</button>
                <div id="key-textarea-container" class="key-textarea-container" style="display: none;">
                    <label for="key-textarea" class="visually-hidden">API key</label>
                    <textarea id="key-textarea" class="key-textarea" placeholder="Paste your API key here..." rows="2"></textarea>
                    <button id="save-key-btn" class="btn-secondary">Save key</button>
                </div>
                <p class="hint">(or add it to the url)<br><code>/{{FEED_ID}}/push#YOUR_API_KEY</code></p>
            </div>
        </div>

        <div id="ready" class="state" style="display: none;">
            <div id="drop-zone" class="{{DROP_ZONE_CLASS}}">
                <img id="artwork-backdrop-img" class="artwork-backdrop-img" alt=""{{BACKDROP_SRC}}>
                <div class="drop-zone-inner">
                    <div class="drop-zone-cta">
                        <button id="select-file" class="btn-primary">Select audio file</button>
                        <input type="file" id="file-input" accept="audio/*,.m4a,.mp3,.mp4,.m4b,.aac,.ogg,.opus,.flac,.wav,.wma,.ac3,.webm,.aiff,.aif" multiple hidden>
                        <p class="hint drop-hint">(or drop here)</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="queue" class="state" style="display: none;">
            <button id="notif-toggle" class="icon-toggle notif-toggle" type="button" aria-label="Enable notifications" aria-pressed="false" hidden>
                <svg class="notif-toggle-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="notif-toggle-label visually-hidden">Notify</span>
            </button>
            <button id="wake-lock-toggle" class="icon-toggle wake-lock-toggle" type="button" aria-label="Keep screen on" aria-pressed="false" hidden>
                <svg class="wake-lock-toggle-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <span class="wake-lock-toggle-label visually-hidden">Keep screen on</span>
            </button>
            <div id="queue-drop-zone" class="queue-drop-zone">
                <button id="queue-add-files" class="btn-queue-add" type="button">Add files</button>
                <input type="file" id="queue-file-input" accept="audio/*,.m4a,.mp3,.mp4,.m4b,.aac,.ogg,.opus,.flac,.wav,.wma,.ac3,.webm,.aiff,.aif" multiple hidden>
                <span class="queue-drop-hint">or drop here</span>
            </div>
            <div id="queue-list" class="queue-list"></div>
        </div>

        <div id="error" class="state" style="display: none;">
            <button id="try-another" class="btn-secondary">Try another file</button>
            <div class="error-card">
                <p id="error-message" class="error-text" aria-live="assertive"></p>
            </div>
        </div>

        <button id="history-toggle" class="history-toggle" type="button" aria-expanded="false" aria-controls="history-section" style="display: none;">
            <span class="history-toggle-text">History</span>
        </button>
        <div id="history-section" class="history-section" style="display: none;">
            <div class="history-panel upload-list-container">
                <h3 class="history-title">History</h3>
                <div class="history-filters" role="tablist" aria-label="Filter uploads">
                    <button class="filter-tab filter-tab--active" role="tab" aria-selected="true" data-filter="local" id="filter-local" aria-controls="history-tabpanel">This browser</button>
                    <button class="filter-tab" role="tab" aria-selected="false" data-filter="browser" id="filter-browser" aria-controls="history-tabpanel">All browsers</button>
                    <button class="filter-tab" role="tab" aria-selected="false" data-filter="all" id="filter-all" aria-controls="history-tabpanel">All uploads</button>
                </div>
                <div id="history-tabpanel" role="tabpanel" aria-labelledby="filter-local">
                <dl id="history-info" class="episode-info" style="display: none;">
                    <dt>Title</dt>
                    <dd id="history-info-title"></dd>
                    <dt>File</dt>
                    <dd id="history-info-filename"></dd>
                    <dt>Dur.</dt>
                    <dd id="history-info-duration"></dd>
                    <dt>Pub.</dt>
                    <dd id="history-info-published"></dd>
                    <dt id="history-info-uploaded-label" class="mobile-only">Added</dt>
                    <dd id="history-info-uploaded" class="mobile-only"></dd>
                </dl>
                <p id="history-empty" class="history-empty" style="display: none;">No uploads yet</p>
                <div id="history-list" class="upload-list" role="listbox" aria-label="History"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Context menu (singleton, repositioned per-use) -->
    <div id="context-menu" class="context-menu" role="menu" hidden>
        <button class="context-menu-item" data-action="rename" role="menuitem" tabindex="-1">Rename</button>
        <button class="context-menu-item context-menu-item--danger" data-action="delete" role="menuitem" tabindex="-1">Delete</button>
    </div>

    <!-- Rename modal -->
    <div id="rename-modal-overlay" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-labelledby="rename-modal-title" aria-modal="true">
            <h3 id="rename-modal-title" class="modal-title">Edit episode</h3>
            <div class="modal-body">
                <div id="rename-suggestion" class="modal-suggestion" hidden>
                    <div class="suggestion-buttons">
                        <button id="rename-note" class="btn-suggestion-icon" aria-label="Add note" title="Add note"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H6l-3 3V4a1 1 0 0 1 1-1z"/></svg></button>
                        <button id="rename-accept" class="btn-suggestion-icon" aria-label="Accept suggestion" title="Accept"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 6.5 12 13 4"/></svg></button>
                    </div>
                    <span class="modal-suggestion-label">Suggestion</span>
                    <div id="rename-suggestion-text" class="modal-suggestion-text"></div>
                    <div id="rename-note-panel" class="modal-note-panel" hidden>
                        <textarea id="rename-note-input" class="modal-note-input" placeholder="Add a note to guide the suggestion..." rows="2" maxlength="500"></textarea>
                    </div>
                </div>
                <label for="rename-input" class="visually-hidden">Title</label>
                <input id="rename-input" class="modal-input" type="text" autocomplete="off" spellcheck="true">
            </div>
            <div class="modal-actions">
                <button id="rename-cancel" class="btn-modal btn-modal--secondary">Cancel</button>
                <button id="rename-save" class="btn-modal btn-modal--primary">Save</button>
            </div>
        </div>
    </div>

    <!-- Delete confirmation -->
    <div id="delete-confirm-overlay" class="modal-overlay" hidden>
        <div class="modal modal--narrow" role="alertdialog" aria-labelledby="delete-confirm-title" aria-describedby="delete-confirm-desc" aria-modal="true">
            <h3 id="delete-confirm-title" class="modal-title">Delete episode?</h3>
            <p id="delete-confirm-desc" class="modal-desc"></p>
            <div class="modal-actions">
                <button id="delete-cancel" class="btn-modal btn-modal--secondary">Cancel</button>
                <button id="delete-confirm" class="btn-modal btn-modal--danger">Delete</button>
            </div>
        </div>
    </div>

    <!-- Frosted glass overlay for mobile history (hidden on desktop) -->
    <div id="frosted-overlay" class="frosted-overlay"></div>

    <script>
    window.FEED_ID = '{{FEED_ID}}';
    window.ICON_ETAG = '{{ICON_ETAG}}';
    window.IS_DEV = {{IS_DEV}};
    window.PROGRESS_SMOOTHING = {{PROGRESS_SMOOTHING}};
    window.VAPID_PUBLIC_KEY = '{{VAPID_PUBLIC_KEY}}';
    </script>
    <script type="module" src="/{{FEED_ID}}/push/app.js"></script>
</body>
</html>
