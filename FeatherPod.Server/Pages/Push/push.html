<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Push to {{FEED_TITLE}}</title>
    <link rel="icon" type="image/png" href="/{{FEED_ID}}/icon.png">
    <style>/* {{CSS}} */</style>
</head>
<body>
    <div class="container">
        <h1>Push to {{FEED_TITLE}}</h1>

        <div id="no-key" class="state" style="display: none;">
            <p class="error">No API key provided</p>
            <p class="hint">Add your API key to the URL:<br><code>/{{FEED_ID}}/push#YOUR_API_KEY</code></p>
        </div>

        <div id="ready" class="state" style="display: none;">
            <div id="drop-zone">
                <button id="select-file" class="btn-primary">Select Audio File</button>
                <input type="file" id="file-input" accept=".mp3,.m4a,.wav,.ogg,.flac,.aac" hidden>
                <p class="hint drop-hint">(or drop here)</p>
            </div>
        </div>

        <div id="uploading" class="state" style="display: none;">
            <h2 id="file-name"></h2>
            <div class="progress-container" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Upload progress">
                <div class="progress-bar" id="upload-progress"></div>
            </div>
            <div class="progress-container progress-container-ghost">
                <div class="progress-bar-ghost" id="upload-progress-ghost"></div>
            </div>
            <p id="upload-status" aria-live="polite">Uploading...</p>
            <p class="hint">&nbsp;</p>
        </div>

        <div id="normalizing" class="state" style="display: none;">
            <h2 id="normalizing-file-name"></h2>
            <div class="progress-container" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Normalization progress">
                <div class="progress-bar indeterminate" id="normalizing-progress"></div>
            </div>
            <div class="progress-container progress-container-ghost">
                <div class="progress-bar-ghost" id="normalizing-progress-ghost"></div>
            </div>
            <p id="normalizing-status" aria-live="polite">Initializing...</p>
            <p class="hint">This may take a minute...</p>
        </div>

        <div id="success" class="state" style="display: none;">
            <div class="success-header">
                <h2><span class="success-icon">&#10003;</span> Upload Complete</h2>
                <button id="upload-another" class="btn-secondary">Upload Another File</button>
            </div>

            <dl id="episode-info" class="episode-info" style="display: none;">
                <dt>Title</dt>
                <dd id="info-title"></dd>
                <dt>File</dt>
                <dd id="info-filename"></dd>
                <dt>Pub.</dt>
                <dd id="info-published"></dd>
                <dt>Size</dt>
                <dd id="info-size"></dd>
                <dt>Len.</dt>
                <dd id="info-duration"></dd>
                <dt id="info-uploaded-label" class="mobile-only">Added</dt>
                <dd id="info-uploaded" class="mobile-only"></dd>
            </dl>

            <p id="ep-filename" class="success-filename"></p>

            <div id="recent-uploads" class="recent-uploads" style="display: none;">
                <h3>Recent Uploads</h3>
                <div class="upload-list"></div>
            </div>
        </div>

        <div id="error" class="state" style="display: none;">
            <h2><span class="error-icon">&#10007;</span> Upload Failed</h2>
            <button id="try-another" class="btn-secondary">Try Another File</button>
            <p id="error-message" class="error" aria-live="assertive"></p>
        </div>
    </div>

    <script>/* {{JS}} */</script>
</body>
</html>
